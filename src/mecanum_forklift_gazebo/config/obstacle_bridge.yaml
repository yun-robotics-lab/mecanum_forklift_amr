# Bridge for the moving cylinders (worlds/warehouse_v2.sdf).

- ros_topic_name: "/obstacle_x/cmd_pos"
  gz_topic_name: "/obstacle_x/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/obstacle_x/joint_states"
  gz_topic_name: "/obstacle_x/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/obstacle_y/cmd_pos"
  gz_topic_name: "/obstacle_y/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/obstacle_y/joint_states"
  gz_topic_name: "/obstacle_y/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS
