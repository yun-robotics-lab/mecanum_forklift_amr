ps4_node:
  ros__parameters:
    linear_speed: 0.3
    angular_speed: 1.0
    turbo_scale: 2.0
    deadzone: 0.1
    joy_timeout: 0.3   # s without /joy -> zero velocity
    fork_rate: 0.04
    fork_min: 0.0
    fork_max: 0.12
    # axis / button indices (Linux DualShock 4). Check yours with `ros2 topic echo /joy`.
    axis_vx: 1
    axis_vy: 0
    axis_wz: 3
    axis_dpad_vertical: 7
    button_enable: 4
    button_turbo: 5
    button_fork_up: 2
    button_fork_down: 0
    button_fork_reset: 3
