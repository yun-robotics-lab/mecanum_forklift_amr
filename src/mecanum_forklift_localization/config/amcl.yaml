# nav2_amcl 1.1.20 (Humble). Differs from the Nav2 defaults: OmniMotionModel (mecanum), laser range
# of the YDLidar X2 model, base_footprint frame, smaller update thresholds for a 6 x 5 m room.
# The initial pose is passed by localization.launch.py (arguments initial_x/y/yaw).
amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    sigma_hit: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    min_particles: 1000
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    save_pose_rate: 0.5
    update_min_a: 0.05     # rad (default 0.2)
    update_min_d: 0.05     # m (default 0.25)

map_server:
  ros__parameters:
    yaml_filename: ""   # overridden by the launch argument `map`
