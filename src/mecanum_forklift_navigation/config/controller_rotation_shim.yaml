# Rotation Shim controller (nav2_rotation_shim_controller 1.1.20, Humble) wrapping Regulated Pure Pursuit.
# Selected by controller_type:=rotation_shim.
# Reference: docs.nav2.org (Rolling) "Configuring Rotation Shim Controller". Parameters the installed
# Humble plugin does not have (max_cost_threshold, rotate_to_heading_once, use_path_orientations) are omitted.
# The shim rotates in place when the path heading is far off, then hands over to the primary controller.
# NOTE: the primary RPP is differential-drive style (vx + wz, never strafes), so this combination does not
# use the mecanum strafing capability; it is a comparison baseline. To wrap DWB instead, set
# primary_controller to "dwb_core::DWBLocalPlanner" and copy the FollowPath params from controller_dwb.yaml.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # in-place turns of up to 180 deg in tight aisles do not translate: 0.15 m / 10 s aborted
      # them with "Failed to make progress" (baseline run 2026-11-23)
      required_movement_radius: 0.10
      movement_time_allowance: 30.0
    general_goal_checker:
      # stateful: once the XY tolerance is met, only the yaw is checked afterwards, so a small XY
      # drift while rotating no longer counts as "goal not reached" (no re-approach / replanning).
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08                # was 0.25: the shim starts the final rotation inside this
                                             # radius, so it is also the worst-case final XY error
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # --- Rotation shim ---
      angular_dist_threshold: 0.785          # rad; rotate in place above this heading error
      angular_disengage_threshold: 0.3925    # rad; hand over to the primary controller below this
      forward_sampling_distance: 0.5         # m; path look-ahead used to estimate the path heading
      rotate_to_heading_angular_vel: 0.6     # rad/s; slow rotation = less wheel slip / XY drift
      max_angular_accel: 1.5                 # rad/s^2; gentle ramp, avoids slip at start/stop
      simulate_ahead_time: 1.0               # s; forward-simulate the rotation for collision checking
      rotate_to_goal_heading: true           # at the goal: stop XY, rotate in place only (vx = vy = 0)
      closed_loop: true                      # use odometry velocity for the acceleration limit
      # --- Primary controller: Regulated Pure Pursuit (same FollowPath namespace in Humble) ---
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6    # slow down over the last 0.6 m so it stops on the goal XY
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: false           # must stay false: the shim does the rotating
      max_robot_pose_search_dist: 10.0
