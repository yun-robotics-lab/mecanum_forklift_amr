# Arbitration in front of cmd_vel_gate (ADR-0007). Priority: e-stop 200 > teleop 100 > docking 50 > navigation 10. Higher priority wins while it is active;
# after `timeout` seconds without messages a source is dropped and the next one takes over.
# NOTE: a source that keeps publishing zero Twists (e.g. keyboard_node, which publishes at 20 Hz)
# still blocks navigation. Use ps4_node (publishes only while L1 is held) or stop the keyboard node.
/**/twist_mux:
  ros__parameters:
    use_sim_time: true
    topics:
      estop:
        topic: cmd_vel_estop
        timeout: 0.3
        priority: 200
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.3
        priority: 100
      docking:
        topic: cmd_vel_dock
        timeout: 0.3
        priority: 50
      navigation:
        topic: cmd_vel_nav_safe
        timeout: 0.5
        priority: 10
